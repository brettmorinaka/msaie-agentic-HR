services:
  # Main Web Application & Agent Orchestrator
  - type: web
    name: hr-agentic-web
    env: python
    buildCommand: "pip install -r requirements.txt && python src/rag/ingest.py"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: MCP_TRANSPORT
        value: stdio
